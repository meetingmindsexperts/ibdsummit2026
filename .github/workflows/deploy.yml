name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Materialize the server-side secrets file from repo secrets. It is
      # git-ignored (never committed) but uploaded by the FTP step below, and
      # blocked from web access by includes/.htaccess.
      - name: Write server-side secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          {
            echo '<?php'
            echo "define('SUPABASE_URL', '${SUPABASE_URL}');"
            echo "define('SUPABASE_SERVICE_KEY', '${SUPABASE_SERVICE_KEY}');"
            echo "define('ADMIN_USER', '${ADMIN_USER}');"
            echo "define('ADMIN_PASSWORD', '${ADMIN_PASSWORD}');"
          } > includes/secrets.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Target directory on Hostinger. For the primary domain this is
          # usually /public_html/ . Set it as a secret to keep it flexible.
          server-dir: /
          # Files that must never ship to the web server.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            router.php
            .editorconfig
            **/*.md
            supabase/**
            includes/secrets.example.php
